# ============================================================
# CSTracker — GitHub Actions Workflow
# Processo: Análise manual de demo CS2 via workflow_dispatch
#
# Como usar:
#   1. Acesse a aba "Actions" no repositório GitHub
#   2. Clique em "Process CS2 Demo"
#   3. Clique em "Run workflow"
#   4. Informe a URL pública da demo (ex: link direto para download)
#   5. Clique em "Run workflow"
#
# Secrets necessários (configurar em Settings > Secrets > Actions):
#   SUPABASE_URL             — URL do projeto Supabase
#   SUPABASE_SERVICE_ROLE_KEY — Service role key
#   PLAYER_STEAM_ID          — Seu Steam ID 64-bit
#
# NOTA: A demo NÃO é commitada no repositório.
# Ela é baixada, processada e descartada dentro do runner.
# ============================================================

name: Process CS2 Demo

on:
  workflow_dispatch:
    inputs:
      demo_url:
        description: "URL pública para download da demo (.dem)"
        required: true
        type: string
      demo_name:
        description: "Nome descritivo da demo (ex: mirage_20240901)"
        required: false
        type: string
        default: "demo"
      dry_run:
        description: "Dry run (processa mas NÃO envia ao Supabase)"
        required: false
        type: boolean
        default: false

jobs:
  analyze:
    name: Analyze Demo
    runs-on: ubuntu-latest
    timeout-minutes: 30  # demos grandes podem demorar; ajuste se necessário

    steps:
      # ── 1. Checkout do repositório ────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "python/requirements.txt"

      # ── 3. Instalar dependências ──────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # ── 4. Validar URL da demo ────────────────────────────
      - name: Validate demo URL
        run: |
          if [[ -z "${{ github.event.inputs.demo_url }}" ]]; then
            echo "❌ Erro: demo_url não foi fornecida."
            exit 1
          fi
          if [[ "${{ github.event.inputs.demo_url }}" != http* ]]; then
            echo "❌ Erro: demo_url deve começar com http:// ou https://"
            exit 1
          fi
          echo "✅ URL validada: ${{ github.event.inputs.demo_url }}"

      # ── 5. Baixar a demo ──────────────────────────────────
      - name: Download demo file
        run: |
          mkdir -p /tmp/cstracker-demos
          DEMO_FILE="/tmp/cstracker-demos/demo.dem"
          echo "Baixando demo de: ${{ github.event.inputs.demo_url }}"
          curl -L --max-time 300 --max-filesize 209715200 \
            -o "$DEMO_FILE" \
            "${{ github.event.inputs.demo_url }}"
          
          # Verificar se o download foi bem-sucedido
          if [[ ! -f "$DEMO_FILE" ]]; then
            echo "❌ Erro: arquivo não foi baixado."
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$DEMO_FILE")
          echo "✅ Demo baixada: $(numfmt --to=iec $FILE_SIZE)"
          
          # Verificar tamanho mínimo (demos muito pequenas são inválidas)
          if [[ $FILE_SIZE -lt 10000 ]]; then
            echo "❌ Erro: arquivo muito pequeno ($FILE_SIZE bytes). Provavelmente inválido."
            exit 1
          fi

      # ── 6. Executar o analisador ──────────────────────────
      - name: Analyze demo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAYER_STEAM_ID: ${{ secrets.PLAYER_STEAM_ID }}
        run: |
          DEMO_FILE="/tmp/cstracker-demos/demo.dem"
          DRY_RUN_FLAG=""
          
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
            echo "⚠️  Modo dry-run ativo. Dados NÃO serão enviados ao Supabase."
          fi
          
          echo "Iniciando análise da demo..."
          python python/analyze_demo.py \
            --demo "$DEMO_FILE" \
            --output-json /tmp/cstracker-demos/result.json \
            $DRY_RUN_FLAG

      # ── 7. Exibir resultado (sempre, mesmo em erro) ───────
      - name: Display result
        if: always()
        run: |
          RESULT_FILE="/tmp/cstracker-demos/result.json"
          if [[ -f "$RESULT_FILE" ]]; then
            echo "=== Resultado da Análise ==="
            cat "$RESULT_FILE"
          else
            echo "Nenhum resultado gerado."
          fi

      # ── 8. Upload do resultado como artifact ──────────────
      # (Útil para debugging; o artifact fica disponível por 30 dias)
      - name: Upload result JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-result-${{ github.run_id }}
          path: /tmp/cstracker-demos/result.json
          if-no-files-found: ignore
          retention-days: 30

      # ── 9. Limpeza da demo ────────────────────────────────
      # (A demo já está em /tmp — é descartada automaticamente ao fim do runner)
      - name: Cleanup (confirmar descarte da demo)
        if: always()
        run: |
          rm -rf /tmp/cstracker-demos/demo.dem
          echo "✅ Demo descartada do runner."

      # ── 10. Sumário do workflow ───────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## CSTracker — Resultado do Processamento" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Demo URL | ${{ github.event.inputs.demo_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Demo Name | ${{ github.event.inputs.demo_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ github.event.inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RESULT_FILE="/tmp/cstracker-demos/result.json"
          if [[ -f "$RESULT_FILE" ]]; then
            echo "### Estatísticas Calculadas" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$RESULT_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
